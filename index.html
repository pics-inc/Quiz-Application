<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Awesome Quiz Application</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" /> 
  <link rel="preconnect" href="https://fontss.gstatic.com" crossorigin />
  <link 
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <!-- <div class="header">
    <h1>Awesome Quiz Application</h1>
  <h3>Time Left 15</h3>
  </div>
  
  <div class="footer">
   <button>Next Que</button> 
  </div>
  
  <h2>Quiz Completed </h2>
  <button>Restart Quiz</button> -->

  <main class="quiz-box" id="quiz-box">
    <header class="quiz-header">
      <h1 class="quiz-title">Awesome Quiz Application</h1>
      <div class="timer">
        <span class="timer-text">Time Left</span>
        <span class="timer-count" id="timer-count">15</span>
      </div>
      <div class="time-line" id="time-line"></div>
    </header>

    <section class="quiz-body">
      <h2 class="question-text" id="question-text"></h2>
      <ul class="options" id="options"></ul>
    </section>

    <footer class="quiz-footer">
      <p class="counter">
        <span id="current-number">1</span>of
        <span id="total-number">5</span> Questions
      </p>

      <button class="next-btn" id="next-btn" type="button">Next Que</button>
    </footer>
  </main>

  <section class="result-box hidden" id="result-box">
    <h2 class="result-title">Quiz Completed 🎉</h2>
    <p class="result-text" id="result-text"></p>
    <button class="next-btn" id="restart-btn" type="button">Restart Quiz</button>
  </section>

  <script src="script.js"></script>
</body>
</html>
